<!DOCTYPE html>
<html 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:fragment="head">
        <title>American Shop</title>
        <meta charset="UTF-8"/>
        <script th:src="@{/js/rutinas.js}" ></script>

        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>

        <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>

    </head>
    <body>

        <header th:fragment="header" class="header">
            <nav class="navbar navbar-expand-sm navbar-dark bg-primary p-4">
                <div class="container">
                    <a th:href="@{/}" class="navbar-brand"><i><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmc9ph4JZFST_CPm-UUVEYDId2qJLZU-S4kA&s" alt="Logo" class="img-fluid rounded-circle mb-1" style="width: 70px;"/></i> Home</a>
                    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <form method="post"
                          th:action='@{/pruebas/query1}'
                          class='place col-10'>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="text-white">Buscar</label>
                                <input type="text" 
                                       class="form-control"
                                       aria-describedby="passwordHelpBlock"
                                       th:value="${descripcion}"
                                       name="descripcion"
                                       />
                            </div>
                        </div>
                    </form>

                </div>

                <div id="resultBlock">
                </div>

                <ul sec:authorize="hasRole('ROLE_ADMIN')"
                    class="navbar-nav">
                    <li class="nav-item px-2 "><a class="nav-link text-white" th:href="@{/categoria/listado}">Categorias</a></li>
                    <li sec:authorize="hasRole('ROLE_ADMIN')"
                        class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" 
                           data-bs-toggle="dropdown" 
                           href="#" 
                           role="button" 
                           aria-expanded="false">Admin</a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item text-white" th:href="@{/usuario/listado}">Usuarios</a></li>
                            <li><a class="dropdown-item text-white" th:href="@{/reportes/principal}">Reportes</a></li>

                        </ul>
                    </li>
                </ul>



                <ul sec:authorize='!isAuthenticated()'
                    class='navbar-nav'>
                    <li class='nav-item px-2 my-auto'>
                        <a class='nav-menu-link nav-link'
                           th:href='@{/login}'>
                            <i class='fas fa-sign-in-alt'></i>
                        </a>
                    </li>
                </ul>
                <ul sec:authorize='isAuthenticated()'
                    class='navbar-nav'>
                    <li class='nav-item px-2 my-auto text-white'>
                        <form method="post"
                              th:action='@{/logout}'>
                            <button class='btn btn-dark'>
                                <i class='fas fa-sign-out-alt'></i>
                            </button>
                        </form>

                    </li>
                </ul>

            </nav>
        </header>


        <section th:fragment="segmentos">
            <div class="container mt-5">
                <div class="row row-cols-1 row-cols-md-3 g-4">

                    <!-- Producto -->
                    <div class="col">
                        <div class="card h-100 position-relative">
                            <img src="https://images.vexels.com/media/users/3/142647/isolated/preview/7975c8713e6cd70ff26097efbbebdbd1-ropa-de-camiseta.png" class="card-img-top img-fluid">
                                <a th:href="@{/producto/listado}" class="btn btn-primary position-absolute top-50 start-50 translate-middle">Productos</a>
                        </div>
                    </div>

                    <!-- Ubicanos -->
                    <div class="col">
                        <div class="card h-100 position-relative">
                            <img src="https://images.icon-icons.com/2073/PNG/512/location_map_twitter_icon_127126.png" class="card-img-top img-fluid">
                                <a th:href="@{/informacion/listado}" class="btn btn-primary position-absolute top-50 start-50 translate-middle">Ubícanos</a>
                        </div>
                    </div>

                    <!-- Redes Sociales -->
                    <div class="col">
                        <div class="card h-100 position-relative">
                            <img src="https://img.freepik.com/vector-gratis/conjunto-logotipos-redes-sociales-3d-nuevo-logotipo-x_78370-3650.jpg?semt=ais_hybrid&w=740" class="card-img-top img-fluid">
                                <a th:href="@{/redes/listado}" class="btn btn-primary position-absolute top-50 start-50 translate-middle">Redes Sociales</a>
                        </div>
                    </div>

                    <!-- Categorías -->
                    <div class="col">
                        <div class="card h-100 position-relative">
                            <img src="https://us.123rf.com/450wm/brisker/brisker1605/brisker160500027/58489983-16-iconos-de-diferentes-categor%C3%ADas-de-productos-para-tiendas-online.jpg" class="card-img-top img-fluid">
                                <a th:href="@{/pruebas/listado}" class="btn btn-primary position-absolute top-50 start-50 translate-middle">Categorías</a>
                        </div>
                    </div>

                    <!-- Descuentos -->
                    <div class="col">
                        <div class="card h-100 position-relative">
                            <img src="https://cdn-icons-png.freepik.com/512/10680/10680634.png" class="card-img-top img-fluid">
                                <a th:href="@{/descuentos/listado}" class="btn btn-primary position-absolute top-50 start-50 translate-middle">Descuentos</a>
                        </div>
                    </div>

                    <!-- Horario -->
                    <div class="col">
                        <div class="card h-100 position-relative">
                            <img src="https://images.vexels.com/media/users/3/151641/isolated/preview/4df6c21a932dc60b655649a55a602010-ilustracion-de-vector-de-reloj.png" class="card-img-top img-fluid">
                                <a th:href="@{/informacion/listado}" class="btn btn-primary position-absolute top-50 start-50 translate-middle">Horario</a>
                        </div>
                    </div>

                    <!-- Perfil -->
                    <div class="col mx-auto">
                        <div class="card h-100 position-relative">
                            <img src="https://cdn-icons-png.flaticon.com/512/3736/3736502.png" class="card-img-top img-fluid">
                                <a th:href="@{/perfil/listado}" class="btn btn-primary position-absolute top-50 start-50 translate-middle">Perfil</a>
                        </div>
                    </div>

                </div>
            </div>
        </section>




        <footer th:fragment="footer" class="p-2 mt-5 bg-primary text-white">
            <p class="text-center lead"> &COPY; Derechos reservados de la tienda </p>

        </footer>

    </body>
</html>
